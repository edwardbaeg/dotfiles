# See README.md for tmux notes and keybindings reference

# STYLE
# - short command names: set, bind, send, display, run, if (not set-option, setw, bind-key, ...)
# - plain `set -g` for window options too; `-s` for server options (escape-time, command-alias, ...)
# - keys: C-/M- uppercase; `bind -n` for root table; quote the whole key only if needed ('M-\')
# - colours: use $COLOR_* from PALETTE (add one if missing); double quotes so variables expand
# - multi-line format strings: don't indent continuation lines (indent becomes part of the string)
# - comments explain why; mark settings that equal the default with `# default`

# PALETTE
#--------------------
# NOTE: must use double quotes to expand variables
COLOR_RED="colour161"
COLOR_PINK="colour197"
COLOR_ORANGE="colour208"
COLOR_PALE_BLUE="colour189"
COLOR_TEAL="colour6"
COLOR_AQUA="colour14"
COLOR_LIME="colour10"

COLOR_GREY="colour247"
COLOR_DARK_GREY="colour241"
COLOR_EXTRA_DARK_GREY="colour237"
COLOR_BG="colour234"

# FORMAT SNIPPETS
#--------------------
# truncate in the shell: #{=N:...} only works on variable names, wrapping a #() in it renders empty
GIT_BRANCH="#[fg=$COLOR_DARK_GREY]#(git -C #{q:pane_current_path} branch --show-current 2>/dev/null | cut -c1-80)"

# claude code runs as its versioned binary (~/.local/bin/claude -> versions/X.Y.Z), so pane_current_command is a bare version number
IS_CLAUDE="#{m/r:^[0-9]+[.][0-9]+[.][0-9]+$,#{pane_current_command}}"
PANE_COMMAND="#{?$IS_CLAUDE,claude,#{pane_current_command}}"

# CORE
#--------------------
set -g default-terminal 'tmux-256color' # default when the terminfo entry exists; falls back to screen otherwise
set -as terminal-features ',xterm*:RGB' # true colour; italics (sitm) already come from the xterm-256color terminfo

set -g base-index 1 # default is 0
set -g pane-base-index 1 # default is 0
set -g renumber-windows on # renumber windows when windows closed

set -g mouse on

# increase scrollback limit (default: 2000)
set -g history-limit 100000

# tmux messages display time
set -g display-time 1001

# Recommended by nvim
set -s escape-time 10 # default since tmux 3.5 (was 500)
set -g focus-events on

set -g monitor-bell on # default
set -g monitor-activity off # default; left off because everything seems to be activity

# Allow image preview for yazi and image.nvim
# https://yazi-rs.github.io/docs/image-preview/#tmux
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# PREFIX
#--------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# PANES
#--------------------
set -g window-active-style "bg=default fg=default" # default

set -g pane-border-style "#{?window_bell_flag,bg=default fg=$COLOR_ORANGE,bg=default fg=$COLOR_EXTRA_DARK_GREY}"

# indicate the active pane
set -g pane-border-indicators colour # default; both = colour and arrow

# add border with pane title; see pane-border-format and FORMATS
set -g pane-border-status bottom
set -g pane-border-format "  #{pane_index} #[fg=$COLOR_DARK_GREY]/#{window_panes} $PANE_COMMAND $GIT_BRANCH  "

set -g pane-border-lines single # default

set -g pane-active-border-style "#{?window_bell_flag,bg=default fg=$COLOR_ORANGE,bg=default fg=default}"

# POPUP
#--------------------
set -g popup-border-lines rounded

# MODES
#--------------------
set -g mode-keys vi # tmux defaults to vi only when $EDITOR/$VISUAL contains "vi"; set explicitly to not depend on env
set -s copy-command 'pbcopy' # used by every copy-pipe* without an explicit command, incl. the default Enter binding
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel # default

# STATUS BAR
#--------------------
set -g status-interval 15
set -g status-style fg=white,bg=default
set -g status-position bottom
set -g visual-activity off

set -g status-left-length 40
set -g status-left-style default
set -g status-left "#[fg=$COLOR_RED,bold,italics]#{s/root//:client_key_table} #[fg=$COLOR_GREY,noitalics][ #S ]#{?pane_synchronized,#[fg=$COLOR_ORANGE,bold] sync,}"

# CODES: #I number; #W window name; #F flag
set -g status-justify left

set -g window-status-style fg=colour245,bg=default
set -g window-status-format ' #W#[fg=default]#F'

set -g window-status-current-style bg=default,fg=white,bold
set -g window-status-current-format ' #W#[fg=colour6]#F'

set -g status-right-length 100
set -g status-right-style fg=$COLOR_GREY,default
set -g status-right '#[bg=default]#{=21:pane_title} #[fg=default,noitalics,nobold]  %I:%M %p '

# MESSAGES
#--------------------
set -g message-style "italics,bold,fg=$COLOR_PINK,bg=default"

# KEYBINDINGS
#--------------------

# --- Reload
# NOTE: `set -a` lines (terminal-features, update-environment, command-alias) append again on
# every reload. Harmless duplicates, but edits/removals to those lines need a server restart
# (kill-server) to take effect, e.g. an edited alias keeps its old value since the first match wins
bind r source-file ~/.tmux.conf \; display "  Config reloaded"

# --- Pane splits
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind -n 'M-\' split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

unbind C-d

# --- Pane navigation
bind j select-pane -D
bind k select-pane -U
bind h select-pane -L
bind l select-pane -R

# --- Pane resize
bind -r M-j resize-pane -D 1
bind -r M-k resize-pane -U 1
bind -r M-l resize-pane -R 1
bind -r M-h resize-pane -L 1

# --- Pane layout & zoom
bind o select-layout -o
bind -n M-z resize-pane -Z

# --- Window selection
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# --- Tree mode
# -s session; -w window; -Z in zoom mode; last window flag is per session
# continuation lines are unindented because leading whitespace becomes part of the string
TREE_FORMAT="\
#{?window_bell_flag,#[fg=$COLOR_ORANGE],}\
#{?window_last_flag,#[fg=$COLOR_PALE_BLUE],}\
#{window_name}#{window_flags}\
#[default]"

bind -n M-s choose-tree -s -Z -F "$TREE_FORMAT"  # sessions collapsed
bind -n M-d choose-tree -w -Z -F "$TREE_FORMAT"  # windows collapsed
bind -n M-f choose-tree -Z -F "$TREE_FORMAT"     # panes collapsed

# --- Sync panes
bind S set -w synchronize-panes \; display "sync: #{?pane_synchronized,ON,OFF}"

# --- Nested-session toggle
# Disable session keybindings and prefix key; for use with nested ssh tmux sessions
bind -n C-Space \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=$COLOR_GREY" \;\
  set status-left "#[fg=$COLOR_RED,bold,italics]#{s/root//:client_key_table} #[fg=$COLOR_DARK_GREY,noitalics][ #S ]" \;\
  set window-status-current-format "#[default] #[fg=colour248]#W#[fg=$COLOR_TEAL]#F" \;\
  if -F '#{pane_in_mode}' 'send -X cancel' \;\
  refresh-client -S \;\

bind -T off C-Space \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u status-left \;\
  set -u window-status-current-style \;\
  set -u window-status-current-format \;\
  refresh-client -S

# --- Floating terminal
bind -n M-/ run -b "${HOME}/bin/tmux-toggle-term.sh float"
bind f run -b "${HOME}/bin/tmux-toggle-term.sh float"

# --- vim-tmux-navigator
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if "$is_vim" 'send C-h' 'select-pane -L'
bind -n C-j if "$is_vim" 'send C-j' 'select-pane -D'
bind -n C-k if "$is_vim" 'send C-k' 'select-pane -U'
bind -n C-l if "$is_vim" 'send C-l' 'select-pane -R'
unbind -n 'C-\'

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# restore clear screen after pressing prefix
bind C-l send C-l

# COMMAND ALIASES
#--------------------
# https://github.com/tmux/tmux/wiki/Advanced-Use#command-aliases
# append (-a) so entries land after the built-in aliases (indices 0-99) without clobbering them;
# avoids the command-alias[N] subscript syntax, which the tmux tree-sitter parser can't parse
set -as command-alias 'rs=rename-session'
set -as command-alias 'rw=rename-window'
set -as command-alias 'ks=kill-session'
set -as command-alias 'kw=kill-window'

# PLUGINS
#--------------------
# IMPORTANT: leave at the bottom
# To install tpm run: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# prefix + I -> installs new plugins
# prefix + U, then type all | <plugin name> -> updates plugins
# prefix + alt + u -> remove/uninstall plugins

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins' # tpm's default (unless ~/.config/tmux/tmux.conf exists)

set -g @plugin 'tmux-plugins/tpm'

# fuzzy find on screen; <prefix><tab> to open, <C-f> for filter mode
set -g @plugin 'laktak/extrakto'
set -g @extrakto_popup_size 50%

# dotbar: minimalist status bar
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @tmux-dotbar-bg default
set -g @tmux-dotbar-right true
set -g @tmux-dotbar-status-right '%I:%M %p '
set -g @tmux-dotbar-fg-session "#9399b2"
set -g @tmux-dotbar-fg-current "#cdd6f4"
set -g @tmux-dotbar-fg "#585b70"
set -g @tmux-dotbar-rounded true
set -g @tmux-dotbar-show-maximized-icon-for-all-tabs true
WINDOW_STATUS_INDEX="#[fg=$COLOR_DARK_GREY]#I"
WINDOW_STATUS_NAME="#[fg=#{?window_bell_flag,$COLOR_ORANGE,#{?window_active,#{@tmux-dotbar-fg-current},#{@tmux-dotbar-fg}}}]#W"
# dotbar hardcodes a mint window-status-bell-style after this config loads, so reset its
# background here and colour bells via the name instead. "terminal" not "default": in
# window formats, default resolves to the bell style. test with: sleep 1 && printf '\a'
WINDOW_FORMAT="#[bg=terminal] $WINDOW_STATUS_INDEX $WINDOW_STATUS_NAME "
set -g @tmux-dotbar-window-status-format "$WINDOW_FORMAT"

# set -g @plugin 'eduwass/tmux-palette' # this keeps launching unexpectedly. like when opening yazi
# set -g @palette-key 'M-p'             # optional, default: C-Space (no-prefix)
# set -g @palette-find-pane-key 'M-f'       # optional, no binding by default
# set -g @palette-move-pane-key 'M-m'       # optional, no binding by default

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# NOTE: for error 128, ensure plugin is installed
run -b '~/.tmux/plugins/tpm/tpm'
